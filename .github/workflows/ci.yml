name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history: the retired-identifier check compares this change
        # against the merge base to find exports that left the surface while
        # their name still stands somewhere. The default shallow clone has no
        # merge base to compare against.
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Check critical text files
        run: corepack pnpm text:check

      # The discovery half of the retired-identifier check, which needs a base
      # commit and therefore cannot live in `text:check`. It reports a name that
      # left the exported surface in this change while still standing in an
      # active source - stale whether it was renamed or deleted. Only on pull
      # requests: on a push to main the merge base is the commit itself.
      - name: Check for exports removed while still referenced
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: corepack pnpm exec tsx tools/check-retired-identifiers.ts --since "origin/$BASE_REF"

      - name: Check working tree whitespace
        run: git diff --check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Check database migrations
        run: corepack pnpm db:check

      - name: Build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: local_seo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d local_seo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/local_seo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run integration tests
        run: corepack pnpm test:integration

  browser-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: corepack pnpm test:browser
